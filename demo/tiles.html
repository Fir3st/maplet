<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Maplet tile checks</title>
<style>
  html, body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #111827; color: #e5e7eb; }
  main { display: flex; gap: 20px; padding: 16px; align-items: flex-start; }
  #map { width: 512px; height: 512px; position: relative; background: #000; flex: none; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  #summary { font-weight: 600; }
  #summary.pass { color: #4ade80; }
  #summary.fail { color: #f87171; }
  #details { white-space: pre-wrap; font: 11px/1.45 ui-monospace, monospace; max-width: 640px; max-height: 80vh; overflow: auto; color: #9ca3af; }
  .hint { color: #9ca3af; margin: 0 0 10px; }
</style>
</head>
<body>
<main>
  <div id="map" aria-label="Tile check map"></div>
  <div>
    <h1>Maplet tile checks</h1>
    <p class="hint">
      <code>?mode=svg|osm|osm-de|opentopomap|esri-imagery</code>; add
      <code>&amp;live=1</code> to request provider servers instead of the local cache
      (<code>osm</code> is always live, like a plain Leaflet tile layer).
      <br /><span id="mode-label"></span>
    </p>
    <p id="summary">running…</p>
    <pre id="details"></pre>
  </div>
</main>
<script type="module" src="./tiles.js"></script>
</body>
</html>
