<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maplet backend parity checks</title>
    <style>
      html,
      body {
        margin: 0;
        font:
          13px/1.5 system-ui,
          sans-serif;
        background: #111827;
        color: #e5e7eb;
      }
      main {
        display: flex;
        gap: 16px;
        padding: 16px;
        align-items: flex-start;
      }
      .map {
        width: 512px;
        height: 512px;
        position: relative;
        background: #ffffff;
        flex: none;
      }
      .label {
        font:
          600 12px ui-monospace,
          monospace;
        color: #9ca3af;
        margin: 4px 0 0;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      #summary {
        font-weight: 600;
      }
      #summary.pass {
        color: #4ade80;
      }
      #summary.fail {
        color: #f87171;
      }
      #details {
        white-space: pre-wrap;
        font:
          11px/1.45 ui-monospace,
          monospace;
        max-width: 640px;
        max-height: 84vh;
        overflow: auto;
        color: #9ca3af;
      }
      .hint {
        color: #9ca3af;
        margin: 0 0 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div id="map-gl" class="map" aria-label="WebGL 1 map"></div>
        <p class="label">webgl1</p>
      </div>
      <div>
        <div id="map-gpu" class="map" aria-label="WebGPU map"></div>
        <p class="label">webgpu</p>
      </div>
      <div>
        <h1>Maplet backend parity</h1>
        <p class="hint">
          The same scene (SVG raster + points + lines + dashes + fills with a hole + a text label +
          an icon) rendered by both backends; pixels, picking and draw structure are compared.
          Results: <code>window.__parityCheckResult</code>.
        </p>
        <p id="summary">running…</p>
        <pre id="details"></pre>
      </div>
    </main>
    <script type="module" src="./parity.js"></script>
  </body>
</html>
