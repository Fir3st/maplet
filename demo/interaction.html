<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Maplet interaction checks</title>
<style>
  html, body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #111827; color: #e5e7eb; }
  main { display: flex; gap: 20px; padding: 16px; align-items: flex-start; }
  #map { width: 512px; height: 512px; position: relative; background: #1f2937; flex: none; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  #summary { font-weight: 600; }
  #summary.pass { color: #4ade80; }
  #summary.fail { color: #f87171; }
  #details { white-space: pre-wrap; font: 11px/1.45 ui-monospace, monospace; max-width: 620px; max-height: 82vh; overflow: auto; color: #9ca3af; }
  .hint { color: #9ca3af; margin: 0 0 10px; }
</style>
</head>
<body>
<main>
  <div id="map" aria-label="Interaction check map"></div>
  <div>
    <h1>Maplet interaction checks</h1>
    <p class="hint">
      Bubbling layer&rarr;group&rarr;map, stopPropagation, hover state and style, cursor,
      visibility override, selection style, keyboard, pinch and feature drag.
      Results: <code>window.__interactionCheckResult</code>.
    </p>
    <p id="summary">running…</p>
    <pre id="details"></pre>
  </div>
</main>
<script type="module" src="./interaction.js"></script>
</body>
</html>
