        - code [ref=e68]: "import { createMap } from '@fir3st/maplet'; const map = await createMap('map', { center: [49.7, 15.2], zoom: 7, controls: ['zoom'] }); const places = map.addLayer({ id: 'places' }); const points = places.addPoints([ { id: 'prague', position: [50.08, 14.44], properties: { name: 'Prague' } }, ]); places.addLabels(points.source);"
      - paragraph [ref=e69]:
        - code [ref=e70]: createMap()
        - text: is asynchronous; later object edits are synchronous commits. Geographic tuples use latitude first. Labels share the point source, so an edit does not require maintaining a second copy of the data.
