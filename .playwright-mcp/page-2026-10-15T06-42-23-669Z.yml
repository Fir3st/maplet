          - text: "#"
      - paragraph [ref=f6e121]: Hold Alt (or ⌥) while dragging or scrolling, unlock the map with the button, or switch the modifier. *Toggle the guard off* removes the plugin, and toggling it back on installs a fresh instance; *Reset view* restores the view together with the guarded state. A blocked attempt shows the hint overlay over the map; on a touch device one finger scrolls the page and two fingers pan and pinch.
