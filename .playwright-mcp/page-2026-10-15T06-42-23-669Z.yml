          - text: "#"
      - generic "ts example" [ref=f6e62]:
        - code [ref=f6e63]: "import { gestureGuard } from '@fir3st/maplet'; const guard = map.use(gestureGuard({ modifier: 'alt', touchPointers: 2 })); guard.api.unlock(); // allow everything until lock(), e.g. from a button guard.api.setModifier('control'); guard.remove(); // restores touch-action and clears the gate map.use(gestureGuard()); // installing again starts a fresh, guarded instance"
