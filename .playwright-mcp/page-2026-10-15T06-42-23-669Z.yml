      - list [ref=f6e158]:
        - listitem [ref=f6e159]: Wheel and double-click zoom need the modifier; a blocked wheel is not prevented, so the page keeps scrolling normally.
        - listitem [ref=f6e160]:
          - text: Keyboard panning and zooming (arrow keys,
          - code [ref=f6e161]: +
          - text: /
          - code [ref=f6e162]: "-"
          - text: ) are never gated, and box selection keeps its explicit Shift requirement.
        - listitem [ref=f6e163]: On touch, a two-finger drag pans, a two-finger pinch zooms, and dragging a feature needs the same two-finger rule.
        - listitem [ref=f6e164]:
          - code [ref=f6e165]: map.interaction?.setGestureGate(gate)
          - text: is the underlying hook if you need a custom policy without this plugin.
