      - list [ref=f2e179]:
        - listitem [ref=f2e180]: Frame cost grows with the samples inside the view, not with the dataset; the field buffer stays bounded, so very large maps render a slightly softer field instead of stalling.
        - listitem [ref=f2e181]:
          - text: Non-positive weights are ignored while rendering;
          - code [ref=f2e182]: count
          - text: still reports them.
        - listitem [ref=f2e183]:
          - code [ref=f2e184]: heatmap
          - text: never replaces the renderer, so it works with the built-in backends, with
          - code [ref=f2e185]: "renderer: 'none'"
          - text: and with a custom renderer, at the cost of drawing over GPU-delivered features.
