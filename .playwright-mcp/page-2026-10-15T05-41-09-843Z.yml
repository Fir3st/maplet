      - group [ref=f2e165]:
        - generic "Complete example source" [ref=f2e166] [cursor=pointer]
        - generic [ref=f2e167]:
          - button "Copy source" [ref=f2e168] [cursor=pointer]
          - link "Download JavaScript" [ref=f2e169] [cursor=pointer]:
