      - paragraph [ref=f2e58]:
        - text: The
        - code [ref=f2e59]: heatmap
        - text: "plugin renders weighted points as a smooth heat field over the map. It is a built-in example of the after-frame hook: one absolutely positioned canvas, no GPU state shared with the renderer, and no work while the map is idle."
      - heading [level=2] [ref=f2e60]:
        - text: Install it
        - link "Link to Install it" [ref=f2e61] [cursor=pointer]:
          - /url: "#install-it"
          - text: "#"
      - generic "ts example" [ref=f2e62]:
        - code [ref=f2e63]: "import { heatmap } from '@fir3st/maplet'; const heat = map.use(heatmap({ points: [ { position: [50.087, 14.421], weight: 1 }, { position: [50.076, 14.451], weight: 0.6 }, ], radius: 30, })); heat.api.addPoint([50.099, 14.435], 0.8); // define more samples heat.api.setPoints(measurements); // or replace them all heat.api.setOptions({ gradient: [[0, '#312e81'], [1, '#f97316']], max: 2 }); heat.api.clear(); // remove every sample heat.remove(); // removes the overlay canvas"
      - paragraph [ref=f2e64]:
        - text: Positions follow the normal coordinate rules — a
        - code [ref=f2e65]: "[lat, lng]"
        - text: tuple or an object,
        - code [ref=f2e66]: "{ x, y }"
        - text: on a planar map — and
        - code [ref=f2e67]: weight
        - text: defaults to
        - code [ref=f2e68]: "1"
        - text: .
