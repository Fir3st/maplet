      - paragraph [ref=e58]:
        - text: The
        - code [ref=e59]: heatmap
        - text: "plugin renders weighted points as a smooth heat field over the map. It is a built-in example of the after-frame hook: one absolutely positioned canvas, no GPU state shared with the renderer, and no work while the map is idle."
      - heading [level=2] [ref=e60]:
        - text: Install it
        - link "Link to Install it" [ref=e61] [cursor=pointer]:
          - /url: "#install-it"
          - text: "#"
      - generic "ts example" [ref=e62]:
        - code [ref=e63]: "import { heatmap } from '@fir3st/maplet'; const heat = map.use(heatmap({ points: [ { position: [50.087, 14.421], weight: 1 }, { position: [50.076, 14.451], weight: 0.6 }, ], radius: 30, })); heat.api.addPoint([50.099, 14.435], 0.8); // define more samples heat.api.setPoints(measurements); // or replace them all heat.api.setOptions({ gradient: [[0, '#312e81'], [1, '#f97316']], max: 2 }); heat.api.clear(); // remove every sample heat.remove(); // removes the overlay canvas"
      - paragraph [ref=e64]:
        - text: Positions follow the normal coordinate rules — a
        - code [ref=e65]: "[lat, lng]"
        - text: tuple or an object,
        - code [ref=e66]: "{ x, y }"
        - text: on a planar map — and
        - code [ref=e67]: weight
        - text: defaults to
        - code [ref=e68]: "1"
        - text: .
