      - heading [level=2] [ref=e124]:
        - text: How the field is drawn
        - link "Link to How the field is drawn" [ref=e125] [cursor=pointer]:
          - /url: "#how-the-field-is-drawn"
          - text: "#"
      - list [ref=e126]:
        - listitem [ref=e127]: "Every rendered frame splats the samples that fall inside the view into a bounded offscreen field — at most 1.5 device pixels per CSS pixel and about a million pixels — and colorizes it through a 256-entry ramp whose alpha follows the accumulated intensity: splat alphas add up and saturate."
        - listitem [ref=e128]:
          - text: Data and option changes schedule a frame through
          - code [ref=e129]: render.invalidate()
          - text: ", so a map that is not moving and whose data did not change does no heatmap work."
        - listitem [ref=e130]:
          - text: "The overlay sits above the map canvas and below controls and DOM overlays: points, labels and markers delivered by the GPU renderer show through faint areas and disappear under hot cores."
          - code [ref=e131]: zIndex
          - text: moves the surface.
        - listitem [ref=e132]:
          - text: A color the browser cannot parse in a gradient is reported through
          - code [ref=e133]: map.on('rendererror')
          - text: on the first frame, like any other render failure.
        - listitem [ref=e134]:
          - text: "Dense data saturates the ramp because splat alphas add up: lower the per-sample weights or raise"
          - code [ref=e135]: max
          - text: so a single sample stays faint and the accumulation — not the largest weight — decides the color.
      - heading [level=2] [ref=e136]:
        - text: Live example
        - link "Link to Live example" [ref=e137] [cursor=pointer]:
          - /url: "#live-example"
          - text: "#"
      - paragraph [ref=e138]:
        - text: The example draws 850 synthetic measurements around Prague with six plain points under the field; the explicit
        - code [ref=e139]: "max: 1"
        - text: keeps one sample faint, so the dense clusters turn hot and the sparse ones stay cool. Replace the data, switch the ramp, grow the splats, add a hotspot or clear the field; the status line reports the sample count.
