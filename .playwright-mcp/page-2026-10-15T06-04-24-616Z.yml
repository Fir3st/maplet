      - heading [level=2] [ref=e166]:
        - text: Notes
        - link "Link to Notes" [ref=e167] [cursor=pointer]:
          - /url: "#notes"
          - text: "#"
      - list [ref=e168]:
        - listitem [ref=e169]: Frame cost grows with the samples inside the view, not with the dataset; the field buffer stays bounded, so very large maps render a slightly softer field instead of stalling.
        - listitem [ref=e170]:
          - text: Non-positive weights are ignored while rendering;
          - code [ref=e171]: count
          - text: still reports them.
        - listitem [ref=e172]:
          - code [ref=e173]: heatmap
          - text: never replaces the renderer, so it works with the built-in backends, with
          - code [ref=e174]: "renderer: 'none'"
          - text: and with a custom renderer, at the cost of drawing over GPU-delivered features.
