      - paragraph [ref=f5e58]:
        - text: The
        - code [ref=f5e59]: gestureGuard
        - text: "plugin keeps a map embedded in a page from panning or zooming by accident: touch gestures need two fingers, mouse gestures need a modifier key, and a one-finger drag scrolls the page instead of moving the map."
