      - list [ref=f8e160]:
        - listitem [ref=f8e161]: Wheel and double-click zoom need the modifier; a blocked wheel is not prevented, so the page keeps scrolling normally.
        - listitem [ref=f8e162]:
          - text: Keyboard panning and zooming (arrow keys,
          - code [ref=f8e163]: +
          - text: /
          - code [ref=f8e164]: "-"
          - text: ) are never gated, and box selection keeps its explicit Shift requirement.
        - listitem [ref=f8e165]: On touch, a two-finger drag pans, a two-finger pinch zooms, and dragging a feature needs the same two-finger rule.
        - listitem [ref=f8e166]:
          - code [ref=f8e167]: map.interaction?.setGestureGate(gate)
          - text: is the underlying hook if you need a custom policy without this plugin.
