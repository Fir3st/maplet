      - paragraph [ref=f8e116]:
        - text: A blocked attempt shows a short hint over the map — *Use 2 fingers to move the map*, *Hold Alt and scroll to zoom the map* — following the same pattern as Leaflet's gesture-handling plugins. It disappears on its own (default after 2.2 s), on the next allowed gesture, or on
        - code [ref=f8e117]: unlock()
        - text: ;
        - code [ref=f8e118]: "overlay: { durationMs, message }"
