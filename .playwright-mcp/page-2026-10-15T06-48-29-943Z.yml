      - paragraph [ref=f8e121]:
        - text: Hold Alt (or ⌥) while dragging or scrolling, unlock the map with the button, or switch the modifier.
        - strong [ref=f8e122]: Toggle the guard off
        - text: removes the plugin and toggling it back on installs a fresh instance;
        - strong [ref=f8e123]: Reset view
        - text: restores the view together with the guarded state. A blocked attempt shows the hint overlay over the map; on a touch device one finger scrolls the page and two fingers pan and pinch.
